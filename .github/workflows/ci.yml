name: CI

# Every PR check lives here so one job, ci-complete, can be the required status check on master.
# Jobs that don't apply to a change are skipped rather than left out, and ci-complete treats a
# skip as a pass, so a path-filtered job never leaves a PR waiting on a check that will never run.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      js: ${{ steps.filter.outputs.js }}
      strings: ${{ steps.filter.outputs.strings }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # A file counts for a filter only if it matches every pattern in it.
          predicate-quantifier: every
          filters: |
            android:
              - '**'
              - '!ios/**'
              - '!**/*.md'
              - '!design/**'
              - '!test/js/**'
              - '!.github/workflows/ios-testflight.yml'
              - '!.github/workflows/refresh-pod-lock.yml'
            ios:
              - '**'
              - '!android/**'
              - '!**/*.md'
              - '!design/**'
              - '!test/js/**'
            # Everything but native code and docs. The native filters exclude test/js/** so a
            # JS-test-only change doesn't start their builds; this one keeps it.
            js:
              - '**'
              - '!ios/**'
              - '!android/**'
              - '!**/*.md'
              - '!design/**'
              - '!.github/workflows/ios-testflight.yml'
              - '!.github/workflows/refresh-pod-lock.yml'
            strings:
              - 'strings/**'

  android:
    name: Build Android APK
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm ci --omit=optional

      - name: Build shared web app
        run: npm run generate

      - name: Sync Capacitor Android project
        run: npx cap sync

      - name: Run Android unit tests
        run: ./android/gradlew testDebugUnitTest -p android --no-daemon

      # Fixed debug key so each build installs as an update over the last one
      - name: Install fork debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/fork-debug.keystore

      - name: Build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: Check the APK is signed with the fork key
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee /dev/stderr | grep -q "SHA-256 digest: 8ec012b0280f5fb85149146a40ac86edf5ee1ae6849794ce0f3d1f3250040964"

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          mv -v app-debug.apk "abs-plus-${build}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: abs-plus-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS simulator app
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    # Intel: the arm64 macOS pool regularly can't schedule a job within GitHub's wait limit.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        run: npm ci --omit=optional

      - name: Build shared web app
        run: npm run generate

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --deployment

      # Picked at run time so runner-image updates don't break a hard-coded device name. Takes an
      # iPhone on the newest runtime the selected Xcode supports; the image also ships newer
      # runtimes for other Xcodes, which are slow to boot.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK: $sdk"
          choice=$(xcrun simctl list devices available -j | jq -r --arg sdk "$sdk" '
            ($sdk | split(".") | map(tonumber)) as $max
            | [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber)) as $version
              | select($version <= $max)
              | .value[] | select(.name | startswith("iPhone"))
              | {version: $version, name, udid}]
            | sort_by(.version) | last // empty | "\(.udid) \(.name) (iOS \(.version | map(tostring) | join(".")))"')
          if [ -z "$choice" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          echo "Using simulator: $choice"
          echo "udid=${choice%% *}" >> "$GITHUB_OUTPUT"

      # Not -quiet: this step also fails on a broken test target, and the log says which one.
      - name: Build iOS simulator app and tests
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            ASSETCATALOG_COMPILER_APPICON_NAME=IconsDebug \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Run iOS unit tests
        working-directory: ios/App
        timeout-minutes: 15
        run: |
          status=0
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=IconsDebug \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building || status=$?

          # Like pytest's "no tests collected": a test target that compiled no tests still exits 0.
          counts=$(xcrun xcresulttool get test-results tests --path TestResults.xcresult | jq -r '
            [.. | objects | select(.nodeType == "Test Case") | .result]
            | "\(length) \(map(select(. == "Passed")) | length)"')
          read -r total passed <<< "$counts"
          echo "iOS unit tests: ${passed:-0} of ${total:-0} passed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::No iOS unit tests ran"
            status=1
          fi
          exit $status

      - name: Upload iOS test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ios-test-results
          path: ios/App/TestResults.xcresult
          if-no-files-found: warn

  js-tests:
    name: Run JavaScript tests
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24

      # Plain npm ci: Vitest's bundler binaries are optional dependencies. The other jobs' --omit=optional
      # only skips the darwin-only fsevents.
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

  strings:
    name: Check strings are alphabetized
    needs: changes
    if: needs.changes.outputs.strings == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Check i18n files
        uses: audiobookshelf/audiobookshelf-i18n-updater@f827a936bfaae6ceee4babf807bf8b5cc20efab4  # v1.3.0
        with:
          directory: 'strings/'

  ci-complete:
    # Every job a change needs must succeed, and every job it doesn't need must be skipped. Checking
    # for failure or cancellation alone isn't enough: a job GitHub cancels because no runner picked
    # it up doesn't report as cancelled here. changes is listed so a failed path filter fails this
    # check instead of every job it gates reading as skipped.
    needs: [changes, android, ios, js-tests, strings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_WANTED: ${{ needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch' }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_WANTED: ${{ needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch' }}
          IOS_RESULT: ${{ needs.ios.result }}
          JS_WANTED: ${{ needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch' }}
          JS_RESULT: ${{ needs.js-tests.result }}
          STRINGS_WANTED: ${{ needs.changes.outputs.strings == 'true' || github.event_name == 'workflow_dispatch' }}
          STRINGS_RESULT: ${{ needs.strings.result }}
        run: |
          bad=0
          check() {
            local name=$1 wanted=$2 result=$3 expected=skipped
            [ "$wanted" = true ] && expected=success
            if [ "$result" = "$expected" ]; then
              echo "ok: $name $result"
            else
              echo "::error::$name was $result, expected $expected"
              bad=1
            fi
          }
          check changes true "$CHANGES_RESULT"
          check android "$ANDROID_WANTED" "$ANDROID_RESULT"
          check ios "$IOS_WANTED" "$IOS_RESULT"
          check js-tests "$JS_WANTED" "$JS_RESULT"
          check strings "$STRINGS_WANTED" "$STRINGS_RESULT"
          exit $bad
