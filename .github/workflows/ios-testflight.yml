name: iOS TestFlight

# Builds ABS+ for iOS and uploads it to TestFlight. Signing is cloud-managed by Xcode through an
# App Store Connect API key (Admin role), so no certificate or provisioning profile is stored here.
#
# Setup lives in the repo, not in upstream's Xcode project: the bundle ID, team, display name and
# icon are swapped in at build time so upstream changes to ios/ still cherry-pick cleanly.
#
# Repo variables: IOS_BUNDLE_ID, IOS_TEAM_ID. Until IOS_BUNDLE_ID is set, every run is skipped.
# Repo secrets: APPSTORE_CONNECT_API_KEY_BASE64 (the .p8 file, base64), APPSTORE_CONNECT_API_KEY_ID,
# APPSTORE_CONNECT_ISSUER_ID. The app record for IOS_BUNDLE_ID must exist in App Store Connect
# before the first run; signing can register the bundle ID but can't create the app.
#
# The secrets are scoped to the steps that need them and the key file is written after npm and
# CocoaPods run, so dependency install scripts never see the Admin-role key.

# Uploads only on request (`gh workflow run ios-testflight.yml`), never on push: nobody can test an
# iOS build before it reaches the TestFlight tester, so each release is a deliberate choice.
on:
  workflow_dispatch:
  # TestFlight builds expire after 90 days; a monthly rebuild keeps the app installable. GitHub
  # disables schedules after 60 days without commits, so a long idle stretch needs a manual run.
  schedule:
    - cron: '0 9 1 * *'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    if: vars.IOS_BUNDLE_ID != ''
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Check signing configuration
        env:
          ASC_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          missing=()
          for name in IOS_TEAM_ID ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing TestFlight configuration: ${missing[*]}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --omit=optional

      - name: Build shared web app
        run: npm run generate

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --deployment

      - name: Make the app ABS+
        working-directory: ios/App
        run: |
          pbx=App.xcodeproj/project.pbxproj
          # Only the App target's Release config uses exactly this bundle ID.
          [ "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.audiobookshelf.app;' "$pbx")" = 1 ] \
            || { echo "::error::App target Release bundle ID not found once in $pbx; upstream changed the project"; exit 1; }
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.audiobookshelf.app;/PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};/" "$pbx"
          sed -i '' -E "s/DEVELOPMENT_TEAM = [A-Z0-9]+;/DEVELOPMENT_TEAM = ${IOS_TEAM_ID};/" "$pbx"
          # The fork's icon, like the Android build's. Only the App target's two configs set this.
          [ "$(grep -c 'ASSETCATALOG_COMPILER_APPICON_NAME = Icons;' "$pbx")" = 2 ] \
            || { echo "::error::App icon setting not found in both App configs in $pbx; upstream changed the project"; exit 1; }
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = Icons;/ASSETCATALOG_COMPILER_APPICON_NAME = IconsDebug;/' "$pbx"

          plist=App/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName ABS+' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' "$plist"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -quiet \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ABSPlus.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ABSPlus.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
